# k8s/static-scheduler/rag-deployment.yaml
# RAG application deployment using Static ML Scheduler

---
apiVersion: v1
kind: Service
metadata:
  name: generation-service
  labels:
    app: generation
    experiment: static-scheduler
spec:
  selector:
    app: generation
  ports:
    - port: 11434
      targetPort: 11434
      name: ollama
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generation-deployment
  labels:
    app: generation
    experiment: static-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generation
  template:
    metadata:
      labels:
        app: generation
        experiment: static-scheduler
        workload-type: generation
        model-size-b: "2"
    spec:
      # USE STATIC ML SCHEDULER
      schedulerName: static-scheduler
      
      # Tolerate GPU taint
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "accelerator"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      
      containers:
        - name: ollama
          image: generation-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 11434
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Waiting for Ollama to start..."
                    sleep 10
                    echo "Pulling gemma:2b model..."
                    ollama pull gemma:2b
                    echo "Model ready!"

---
apiVersion: v1
kind: Service
metadata:
  name: rag-app-service
  labels:
    app: rag-app
    experiment: static-scheduler
spec:
  selector:
    app: rag-app
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: NodePort

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-deployment
  labels:
    app: rag-app
    experiment: static-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-app
  template:
    metadata:
      labels:
        app: rag-app
        experiment: static-scheduler
        workload-type: retrieval
    spec:
      # USE STATIC ML SCHEDULER
      schedulerName: static-scheduler
      
      containers:
        - name: rag
          image: rag-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          env:
            - name: GENERATION_SERVICE_URL
              value: "http://generation-service:11434/api/generate"
            - name: GENERATION_TIMEOUT
              value: "60"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10

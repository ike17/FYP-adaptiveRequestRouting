# k8s/bandit-scheduler/rbac-adaptive.yaml
# RBAC for Adaptive Bandit Scheduler with pod eviction permissions

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3d-scheduler
  namespace: default
  labels:
    app: k3d-scheduler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3d-scheduler-role
  labels:
    app: k3d-scheduler
rules:
  # Pod management - includes DELETE for eviction
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  # Node information
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # Pod binding (scheduling)
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]

  - apiGroups: [""]
    resources: ["bindings"]
    verbs: ["create"]

  # Events for logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Service access for metrics endpoint
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  # Endpoints for service discovery
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3d-scheduler-binding
  labels:
    app: k3d-scheduler
subjects:
  - kind: ServiceAccount
    name: k3d-scheduler
    namespace: default
roleRef:
  kind: ClusterRole
  name: k3d-scheduler-role
  apiGroup: rbac.authorization.k8s.io